name: MLOPS CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Data Processing
        run: python src/data/run_processing.py

      - name: Run Feature Engineering
        run: |
          python src/features/engineer.py \
            --input data/processed/cleaned_house_data.csv \
            --output data/processed/features_house_data.csv \
            --preprocessor models/trained/preprocessor.pkl

      - name: Setup MLflow
        run: |
          mlflow server \
            --host 0.0.0.0 \
            --port 5555 \
            --backend-store-uri sqlite:///mlruns.db \
            --default-artifact-root /tmp/mlruns &
          sleep 5  # Wait for MLflow server to be ready

      - name: Run Model Training
        run: |
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/features_house_data.csv \
            --models-dir models \
            --mlflow-tracking-uri http://localhost:5555