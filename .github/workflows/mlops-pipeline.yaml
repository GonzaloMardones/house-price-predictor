name: MLOps Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    
jobs:
  data-processing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # <<< Actualizado
      
    - name: Set up Python
      uses: actions/setup-python@v5 # <<< Actualizado
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Process data
      # NOTA: Revisa si de verdad usa argumentos, lo dejé sin ellos asumiendo
      # que confías en la forma que lo tiene tu mlops-ci-workflow
      run: |
        python src/data/run_processing.py 
        
    - name: Engineer features
      run: |
        python src/features/engineer.py \
          --input data/processed/cleaned_house_data.csv \
          --output data/processed/features_house_data.csv \
          --preprocessor models/trained/preprocessor.pkl
        
    - name: Upload processed data
      uses: actions/upload-artifact@v4
      with:
        name: processed-data
        path: data/processed/features_house_data.csv
        
    - name: Upload preprocessor
      uses: actions/upload-artifact@v4
      with:
        name: preprocessor
        path: models/trained/preprocessor.pkl
        
  model-training:
    needs: data-processing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # <<< Actualizado
      
    - name: Set up Python
      uses: actions/setup-python@v5 # <<< Actualizado
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download processed data
      uses: actions/download-artifact@v4
      with:
        name: processed-data
        path: data/processed/
        
    - name: Set up MLflow
      run: |
        # Aproximación de mlops-ci-workflow para MLflow 
        mlflow server \
          --host 0.0.0.0 \
          --port 5555 \
          --backend-store-uri sqlite:///mlruns.db \
          --default-artifact-root /tmp/mlruns &
        sleep 5
        
    - name: Train model
      run: |
        mkdir -p models
        python src/models/train_model.py \
          --config configs/model_config.yaml \
          --data data/processed/features_house_data.csv \
          --models-dir models \
          --mlflow-tracking-uri http://localhost:5555
        
    - name: Upload trained model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/
        
  build-and-publish:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # <<< Actualizado
      
    - name: Download trained model
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: models/
        
    - name: Download preprocessor
      uses: actions/download-artifact@v4
      with:
        name: preprocessor
        path: models/trained/
        
    - name: Log in to DockerHub Container Registry
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
 
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-predictor:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-predictor:${{ github.sha }}
